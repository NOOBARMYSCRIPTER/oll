name: Build Native Bypass

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Patch Dobby Assembly Syntax
      run: |
        find build/ -name "closure_bridge_arm64.asm" -exec sed -i 's/common_closure_bridge_handler@PAGEOFF/:lo12:common_closure_bridge_handler/g' {} +
        find build/ -name "closure_bridge_arm64.asm" -exec sed -i 's/common_closure_bridge_handler@PAGE/:pg_hi21:common_closure_bridge_handler/g' {} +
        echo "[+] Dobby assembly syntax successfully converted to ELF format!"

    - name: Build Library
      run: |
        cd build
        make

    - name: Upload Compiled Library
      uses: actions/upload-artifact@v4
      with:
        name: liboxide_bypass-arm64
        path: build/liboxide_bypass.so
